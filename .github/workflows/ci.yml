name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Was a single pinned '24' — never actually tested this package's own
        # declared engines.node floor (>=18, EOL, bumped to >=20 same day as
        # this fix, 2026-09-09). [20, 24] is real coverage of the promised range.
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # systems/npm-dependency-policy rules 2+3 — pin an exact npm version and
      # make an unapproved install script a hard CI failure instead of npm
      # 12's silent skip. Missing entirely until 2026-09-09 (systems/github-ci).
      - name: Pin npm version
        run: npm install -g npm@12.0.2

      - name: Enforce allowScripts in CI
        run: npm config set strict-allow-scripts true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit the shipped templates (dogfooding rls audit)
        run: node dist/index.js audit templates/
